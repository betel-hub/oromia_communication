name: meine_entwickler
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

    

  # Localization
  intl: ^0.20.3

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Storage
  shared_preferences: ^2.2.3

  # Networking
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2

  url_launcher: ^6.3.0

  # UI
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/mock/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1B5FAF"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#1B5FAF"
    theme_color: "#1B5FAF"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48

flutter_native_splash:
  color: "#1B5FAF"
  image: assets/icon.png
  android: true
  ios: false
  web: true
  fullscreen: true
  android_12:
    color: "#1B5FAF"
    image: assets/icon.png